<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal del Empleado — Seguridad LTDA</title>
  <link rel="stylesheet" href="C:\Users\ga214\Desktop\sprint1-ERP\04-evs2-grupo-acubririfdep\portal-empleado\login\style.css" />
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <!-- Encabezado -->
      <div class="login-header">
        <div class="logo-icon">🔒</div>
        <h1 class="company-name">Seguridad LTDA</h1>
        <p class="portal-label">Portal del Empleado</p>
      </div>

      <!-- Formulario de login -->
      <form id="loginForm" novalidate>

        <div class="form-group">
          <label for="username">Usuario corporativo</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="nombre@seguridad.cl"
            autocomplete="username"
            required
          />
          <span class="field-error" id="usernameError"></span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="toggle-password"
              aria-label="Mostrar u ocultar contraseña"
              id="togglePassword"
            >👁</button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <!-- Mensaje de error general -->
        <div class="alert alert-error" id="loginError" role="alert" aria-live="polite" hidden>
          Credenciales inválidas. Verifica tu usuario y contraseña.
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
          Iniciar sesión
        </button>

      </form>

      <p class="help-text">¿Problemas para ingresar? Contacta a TI.</p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
