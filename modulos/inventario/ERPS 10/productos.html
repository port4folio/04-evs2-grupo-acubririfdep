<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP Seguridad LTDA — Ficha de Producto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }

    header {
      background: #1a1a2e;
      color: white;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 20px; }
    header span { background: #e94560; padding: 4px 10px; border-radius: 4px; font-size: 12px; }

    .container { max-width: 1100px; margin: 32px auto; padding: 0 16px; }

    .card {
      background: white;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: #1a1a2e; border-bottom: 2px solid #e94560; padding-bottom: 8px; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 13px; font-weight: bold; color: #555; }
    .form-group input {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .form-group input:focus { outline: none; border-color: #e94560; }

    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin-top: 16px;
    }
    .btn-primary { background: #e94560; color: white; }
    .btn-primary:hover { background: #c73652; }
    .btn-secondary { background: #1a1a2e; color: white; margin-left: 8px; }
    .btn-secondary:hover { background: #2d2d4e; }

    .alert {
      padding: 10px 16px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 14px;
      display: none;
    }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #1a1a2e; color: white; }
    thead th { padding: 10px 14px; text-align: left; }
    tbody tr:nth-child(even) { background: #f8f9fa; }
    tbody td { padding: 10px 14px; border-bottom: 1px solid #eee; }

    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-ok { background: #d4edda; color: #155724; }
    .badge-warn { background: #fff3cd; color: #856404; }

    .stock-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .stock-form .form-group { flex: 1; min-width: 150px; }
  </style>
</head>
<body>

<header>
  <h1>🏢 ERP Seguridad LTDA</h1>
  <span>Módulo Inventario</span>
</header>

<div class="container">

  <!-- REGISTRAR PRODUCTO -->
  <div class="card">
    <h2>📦 Registrar Nuevo Producto</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Código Alfanumérico *</label>
        <input type="text" id="codigo" placeholder="Ej: PROD-001">
      </div>
      <div class="form-group">
        <label>Nombre del Producto *</label>
        <input type="text" id="nombre" placeholder="Ej: Candado Seguridad 40mm">
      </div>
      <div class="form-group">
        <label>Grupo *</label>
        <input type="text" id="grupo" placeholder="Ej: Cerrajería">
      </div>
      <div class="form-group">
        <label>Subgrupo</label>
        <input type="text" id="subgrupo" placeholder="Ej: Candados">
      </div>
      <div class="form-group">
        <label>Fotografía (URL)</label>
        <input type="text" id="fotografia" placeholder="Ej: img/producto.jpg">
      </div>
      <div class="form-group">
        <label>Stock Actual</label>
        <input type="number" id="stockActual" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>Stock Mínimo</label>
        <input type="number" id="stockMinimo" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>Stock Máximo</label>
        <input type="number" id="stockMaximo" placeholder="0" min="0">
      </div>
    </div>
    <button class="btn btn-primary" onclick="registrarProducto()">➕ Registrar Producto</button>
    <button class="btn btn-secondary" onclick="cargarCatalogo()">🔄 Actualizar Catálogo</button>
    <div class="alert alert-success" id="alertSuccess"></div>
    <div class="alert alert-error" id="alertError"></div>
  </div>

  <!-- CONSULTAR STOCK -->
  <div class="card">
    <h2>🔍 Consultar Stock por Código</h2>
    <div class="stock-form">
      <div class="form-group">
        <label>Código del Producto</label>
        <input type="text" id="codigoConsulta" placeholder="Ej: PROD-001">
      </div>
      <button class="btn btn-primary" onclick="consultarStock()" style="margin-top:0">🔍 Consultar</button>
    </div>
    <div class="alert" id="alertStock"></div>
  </div>

  <!-- CATÁLOGO -->
  <div class="card">
    <h2>📋 Catálogo de Productos</h2>
    <table>
      <thead>
        <tr>
          <th>Código</th>
          <th>Nombre</th>
          <th>Grupo</th>
          <th>Subgrupo</th>
          <th>Stock Actual</th>
          <th>Mínimo</th>
          <th>Máximo</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tablaCatalogo">
        <tr><td colspan="8" style="text-align:center; color:#999">No hay productos registrados</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
  const API = 'http://localhost:3000/api/inventario';

  // Registrar producto
  async function registrarProducto() {
    const producto = {
      codigo: document.getElementById('codigo').value.trim(),
      nombre: document.getElementById('nombre').value.trim(),
      grupo: document.getElementById('grupo').value.trim(),
      subgrupo: document.getElementById('subgrupo').value.trim(),
      fotografia: document.getElementById('fotografia').value.trim(),
      stockActual: parseInt(document.getElementById('stockActual').value) || 0,
      stockMinimo: parseInt(document.getElementById('stockMinimo').value) || 0,
      stockMaximo: parseInt(document.getElementById('stockMaximo').value) || 0
    };

    if (!producto.codigo || !producto.nombre || !producto.grupo) {
      mostrarError('Código, nombre y grupo son obligatorios.');
      return;
    }

    try {
      const res = await fetch(`${API}/productos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(producto)
      });
      const data = await res.json();

      if (res.ok) {
        mostrarExito(`✅ Producto ${producto.codigo} registrado correctamente.`);
        limpiarFormulario();
        cargarCatalogo();
      } else {
        mostrarError(`❌ ${data.error}`);
      }
    } catch (err) {
      mostrarError('❌ No se pudo conectar al servidor. ¿Está corriendo node app.js?');
    }
  }

  // Cargar catálogo
  async function cargarCatalogo() {
    try {
      const res = await fetch(`${API}/productos`);
      const data = await res.json();
      const tbody = document.getElementById('tablaCatalogo');

      if (data.catalogo.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#999">No hay productos registrados</td></tr>';
        return;
      }

      tbody.innerHTML = data.catalogo.map(p => `
        <tr>
          <td><strong>${p.codigo}</strong></td>
          <td>${p.nombre}</td>
          <td>${p.grupo}</td>
          <td>${p.subgrupo || '-'}</td>
          <td>${p.stockActual}</td>
          <td>${p.stockMinimo}</td>
          <td>${p.stockMaximo}</td>
          <td><span class="badge ${p.stockActual <= p.stockMinimo ? 'badge-warn' : 'badge-ok'}">
            ${p.stockActual <= p.stockMinimo ? '⚠️ Stock bajo' : '✅ Normal'}
          </span></td>
        </tr>
      `).join('');
    } catch (err) {
      console.error('Error cargando catálogo:', err);
    }
  }

  // Consultar stock
  async function consultarStock() {
    const codigo = document.getElementById('codigoConsulta').value.trim();
    if (!codigo) return;

    try {
      const res = await fetch(`${API}/productos/${codigo}/stock`);
      const data = await res.json();
      const alerta = document.getElementById('alertStock');
      alerta.style.display = 'block';

      if (res.ok) {
        alerta.className = 'alert alert-success';
        alerta.innerHTML = `
          <strong>${data.nombre}</strong> (${data.codigo}) —
          Stock actual: <strong>${data.stockActual}</strong> |
          Mínimo: ${data.stockMinimo} | Máximo: ${data.stockMaximo} |
          ${data.alerta}
        `;
      } else {
        alerta.className = 'alert alert-error';
        alerta.textContent = `❌ ${data.error}`;
      }
    } catch (err) {
      mostrarError('❌ No se pudo conectar al servidor.');
    }
  }

  function mostrarExito(msg) {
    const el = document.getElementById('alertSuccess');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alertError').style.display = 'none';
  }

  function mostrarError(msg) {
    const el = document.getElementById('alertError');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('alertSuccess').style.display = 'none';
  }

  function limpiarFormulario() {
    ['codigo','nombre','grupo','subgrupo','fotografia','stockActual','stockMinimo','stockMaximo']
      .forEach(id => document.getElementById(id).value = '');
  }

  // Cargar catálogo al abrir la página
  cargarCatalogo();
</script>

</body>
</html>
